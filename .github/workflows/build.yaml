name: Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
  # release.yml runs the same tests and build on the tagged revision.
  workflow_call:

jobs:
  test-plugin:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run test

      - name: Type-check
        run: pnpm run typecheck

      - name: Frontend unit tests
        run: pnpm run test:unit

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # SteamOS's Python; the vendored externals are built for it.
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests/python -t tests/python -v

  build-plugin:
    name: Build plugin
    runs-on: ubuntu-latest
    needs: [test-plugin, test-python]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Install PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: pnpm run setup
            
      - name: Build plugin
        run: pnpm run build:plugin

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: pyrodeck
          path: out/*.zip
          if-no-files-found: error
